name: Build & Package Luma Unreal Engine Mod

on:
  push:
    paths:
      - 'Shaders/Unreal Engine/**'
  workflow_dispatch:

jobs:
  package-unreal:
    name: Package Unreal Engine mod
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare release and dev temp packages
        shell: pwsh
        run: |
          # Cleanup any previous temp packages
          Remove-Item -Recurse -Force temp_package_release, temp_package_dev -ErrorAction SilentlyContinue
          # Create directories
          New-Item -ItemType Directory -Path temp_package_release\Luma -Force | Out-Null
          New-Item -ItemType Directory -Path temp_package_dev\Luma -Force | Out-Null

          # Copy Shaders to both packages
          Copy-Item -Path 'Shaders/*' -Destination 'temp_package_release\Luma' -Recurse -Force
          Copy-Item -Path 'Shaders/*' -Destination 'temp_package_dev\Luma' -Recurse -Force

          # Prune release package: keep only allowed top-level dirs and remove dev/sample folders
          $shaderRootRel = Join-Path 'temp_package_release' 'Luma'
          $allowedDirs = @('Global','Includes','Unreal Engine')
          Get-ChildItem -Path $shaderRootRel -Directory | ForEach-Object {
            if ($allowedDirs -notcontains $_.Name) {
              Remove-Item $_.FullName -Recurse -Force
            } else {
              $foldersToDelete = @('Unused','Dev','Sample')
              foreach ($folder in $foldersToDelete) {
                $target = Join-Path $_.FullName $folder
                if (Test-Path $target) { Remove-Item $target -Recurse -Force }
              }
            }
          }

          # For release: remove non-hlsl/hlsli files
          Get-ChildItem -Path $shaderRootRel -Recurse -File | ForEach-Object {
            if (@('.hlsl','.hlsli') -notcontains $_.Extension.ToLower()) { Remove-Item $_.FullName -Force }
          }

      - name: Add d3dcompiler and binaries (dxgi, NGX, addon) to both packages
        shell: pwsh
        run: |
          $d3d_x64 = 'Shaders/Decompiler/d3dcompiler_47.dll'
          $d3d_x32 = 'Shaders/Decompiler/d3dcompiler_47_x32.dll'
          $rsSrc64 = 'Source/External/reshade/bin/x64/Release/ReShade64.dll'
          $rsSrc32 = 'Source/External/reshade/bin/Win32/Release/ReShade32.dll'
          $ngxRel = 'Source/External/NGX/bin/rel/nvngx_dlss.dll'
          $ngxDev = 'Source/External/NGX/bin/dev/nvngx_dlss.dll'

          # Copy d3dcompiler into both Luma roots (prefer x64)
          if (Test-Path $d3d_x64) {
            Copy-Item -Path $d3d_x64 -Destination 'temp_package_release\Luma' -Force
            Copy-Item -Path $d3d_x64 -Destination 'temp_package_dev\Luma' -Force
          } elseif (Test-Path $d3d_x32) {
            Copy-Item -Path $d3d_x32 -Destination 'temp_package_release\Luma' -Force
            Copy-Item -Path $d3d_x32 -Destination 'temp_package_dev\Luma' -Force
          } else {
            Write-Host 'd3dcompiler not found; continuing without it.'
          }

          # Copy ReShade as dxgi.dll into both temp roots if present
          if (Test-Path $rsSrc64) {
            Copy-Item -Path $rsSrc64 -Destination 'temp_package_release\dxgi.dll' -Force
            Copy-Item -Path $rsSrc64 -Destination 'temp_package_dev\dxgi.dll' -Force
            Write-Host 'Copied ReShade64 to temp_package/*\\dxgi.dll'
          } elseif (Test-Path $rsSrc32) {
            Copy-Item -Path $rsSrc32 -Destination 'temp_package_release\dxgi.dll' -Force
            Copy-Item -Path $rsSrc32 -Destination 'temp_package_dev\dxgi.dll' -Force
            Write-Host 'Copied ReShade32 to temp_package/*\\dxgi.dll'
          } else {
            Write-Host 'ReShade build not found; skipping dxgi copy.'
          }

          # Copy NGX DLSS: use rel for release, dev for dev if available
          if (Test-Path $ngxRel) {
            Copy-Item -Path $ngxRel -Destination 'temp_package_release\nvngx_dlss.dll' -Force
            Write-Host 'Copied NGX rel to release package'
          }
          if (Test-Path $ngxDev) {
            Copy-Item -Path $ngxDev -Destination 'temp_package_dev\nvngx_dlss.dll' -Force
            Write-Host 'Copied NGX dev to dev package'
          }

          # Try to locate an addon file for Luma-Unreal Engine in build outputs or repo
          $addon = Get-ChildItem -Path . -Recurse -Filter 'Luma-Unreal*.addon' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($addon) {
            Copy-Item -Path $addon.FullName -Destination 'temp_package_release\' -Force
            Copy-Item -Path $addon.FullName -Destination 'temp_package_dev\' -Force
            Write-Host "Copied addon $($addon.Name) to both temp_package_release and temp_package_dev"
          } else {
            Write-Host 'No Luma-Unreal addon found in repo; skipping addon copy.'
          }

      - name: Create full Luma-Unreal_Engine.zip
        shell: pwsh
        run: |
          if (-not (Test-Path 'temp_package_release')) { Write-Error 'temp_package_release missing'; exit 1 }
          if (Test-Path 'Luma-Unreal_Engine.zip') { Remove-Item 'Luma-Unreal_Engine.zip' -Force }
          Compress-Archive -Path 'temp_package_release\*' -DestinationPath 'Luma-Unreal_Engine.zip' -Force
          Write-Host 'Created Luma-Unreal_Engine.zip'

      - name: Create Luma-Unreal_Engine-Test.zip (development build bundle)
        shell: pwsh
        run: |
          if (-not (Test-Path 'temp_package_dev')) { Write-Error 'temp_package_dev missing'; exit 1 }
          if (Test-Path 'Luma-Unreal_Engine-Test.zip') { Remove-Item 'Luma-Unreal_Engine-Test.zip' -Force }
          Compress-Archive -Path 'temp_package_dev\*' -DestinationPath 'Luma-Unreal_Engine-Test.zip' -Force
          Write-Host 'Created Luma-Unreal_Engine-Test.zip (development build)'

      - name: List produced files
        shell: pwsh
        run: Get-ChildItem -Path . -Filter 'Luma-Unreal_Engine*.zip' -File | Format-Table Name,Length

      - name: Upload Unreal Engine mod artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Unreal-Engine-artifacts
          path: |
            Luma-Unreal_Engine.zip
            Luma-Unreal_Engine-Test.zip

      - name: Cleanup temp
        shell: pwsh
        run: Remove-Item -Recurse -Force temp_package
