name: Build Unreal Engine Artifacts

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-unreal:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - config: Publishing-Release
            artifact_suffix: Release
          - config: Test-Release
            artifact_suffix: Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1.2

      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg.git

      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat

      - name: Install vcpkg packages (Prey manifest)
        run: .\vcpkg\vcpkg install --triplet x64-windows --x-manifest-root=./Source/Games/Prey
        continue-on-error: true

      - name: Integrate vcpkg with MSBuild
        run: .\vcpkg\vcpkg integrate install

      - name: Build Luma.sln x64-${{ matrix.config }}
        run: msbuild Luma.sln /p:Configuration=${{ matrix.config }} /p:Platform=x64 /p:DefineConstants="REMOTE_BUILD=1"

      - name: Package Unreal Engine addon (no ReShade)
        id: package
        shell: pwsh
        run: |
          $addonDir = "Binaries\x64-${{ matrix.config }}"
          $addonFile = Get-ChildItem -Path $addonDir -Filter "Luma-*Unreal Engine*.addon" -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $addonFile) {
            Write-Error "Unreal Engine addon not found in $addonDir"
            exit 1
          }

          $fileName = $addonFile.Name
          $cleanFileName = $fileName -replace '^Luma-_', 'Luma-'
          $projectName = $cleanFileName -replace '^Luma-', '' -replace '\.addon$', ''

          $zipName = "Luma-$projectName"
          if ("${{ matrix.config }}" -eq "Test-Release") {
            $zipName += "-Test"
          }
          $zipName = $zipName -replace ' ', '_'
          $zipName += ".zip"

          $tempDir = "temp_package_unreal"
          Remove-Item -Recurse -Force $tempDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "$tempDir/Luma" -Force | Out-Null

          Copy-Item -Path "Shaders/*" -Destination "$tempDir/Luma" -Recurse

          $allowedDirs = @("Global", "Includes", $projectName)
          $allowedExtensions = @(".hlsl", ".hlsli")
          $shaderRoot = Join-Path $tempDir "Luma"

          Get-ChildItem -Path $shaderRoot -Directory | ForEach-Object {
            if ($allowedDirs -notcontains $_.Name) {
              Remove-Item $_.FullName -Recurse -Force
            } else {
              $foldersToDelete = @("Unused", "Dev", "Sample")
              foreach ($folder in $foldersToDelete) {
                $target = Join-Path $_.FullName $folder
                if (Test-Path $target) {
                  Remove-Item $target -Recurse -Force
                }
              }
            }
          }

          Get-ChildItem -Path $shaderRoot -Recurse -File | ForEach-Object {
            if ($allowedExtensions -notcontains $_.Extension.ToLower()) {
              Remove-Item $_.FullName -Force
            }
          }

          Copy-Item -Path "Shaders/Decompiler/d3dcompiler_47.dll" -Destination "$tempDir/Luma"

          Write-Host "Skipping ReShade bundling for Unreal artifacts."

          $ngxSrc = "Source/External/NGX/bin/rel/nvngx_dlss.dll"
          if (Test-Path $ngxSrc) {
            Copy-Item -Path $ngxSrc -Destination $tempDir -Force
          } else {
            Write-Host "NGX DLSS DLL not found at $ngxSrc — skipping"
          }

          Copy-Item -Path $addonFile.FullName -Destination (Join-Path $tempDir $cleanFileName)

          Compress-Archive -Path "$tempDir/*" -DestinationPath "$zipName" -Force
          Remove-Item -Recurse -Force $tempDir

          "zip_file=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload Release artifact
        if: matrix.artifact_suffix == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Unreal-Engine-Release
          path: ${{ steps.package.outputs.zip_file }}

      - name: Upload Test artifact
        if: matrix.artifact_suffix == 'Test'
        uses: actions/upload-artifact@v4
        with:
          name: Unreal-Engine-Test
          path: ${{ steps.package.outputs.zip_file }}
