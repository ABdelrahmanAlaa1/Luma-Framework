name: Build Unreal Engine Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-unreal:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Test-Release, Publishing-Release]
        platform: [x64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1.2

    - name: Clone vcpkg
      run: git clone https://github.com/microsoft/vcpkg.git

    - name: Bootstrap vcpkg
      run: .\vcpkg\bootstrap-vcpkg.bat

    - name: Integrate vcpkg with MSBuild
      run: .\vcpkg\vcpkg integrate install

    - name: Build ReShade.sln Release
      run: msbuild "Source\External\reshade\ReShade.sln" /p:Configuration="Release" /p:Platform="64-bit"

    - name: Build Unreal Engine addon
      run: |
        msbuild "Source\Games\Unreal Engine\Unreal Engine.vcxproj" /p:Configuration=${{ matrix.config }} /p:Platform=${{ matrix.platform }} /p:DefineConstants="REMOTE_BUILD=1"

    - name: Package Unreal Engine
      id: create_zip
      shell: pwsh
      if: matrix.config == 'Publishing-Release' || matrix.config == 'Test-Release'
      run: |
        $projectName = 'Unreal Engine'
        $addonDir = "Binaries\${{ matrix.platform }}-${{ matrix.config }}"
        $addonFile = Join-Path $addonDir "Luma-$projectName.addon"
        if (-not (Test-Path $addonFile)) {
          Write-Host "Addon missing at $addonFile"
          "skip_upload=true" >> $env:GITHUB_OUTPUT
          exit 0
        }

        $zipName = "Luma-$projectName"
        if ("${{ matrix.config }}" -eq 'Test-Release') {
          $zipName += '-Test'
        }
        $zipName = $zipName -replace ' ', '_'
        $zipName += '.zip'

        $tempDir = 'temp_package'
        Remove-Item -Recurse -Force $tempDir -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Path "$tempDir/Luma" -Force | Out-Null

        $shaderRoot = Join-Path $tempDir 'Luma'
        $allowedDirs = @('Global', 'Includes', $projectName)
        foreach ($dir in $allowedDirs) {
          $source = Join-Path 'Shaders' $dir
          if (Test-Path $source) {
            Copy-Item -Path $source -Destination $shaderRoot -Recurse
          }
        }

        $allowedExtensions = @('.hlsl', '.hlsli')
        Get-ChildItem -Path $shaderRoot -Recurse -File | ForEach-Object {
          if ($allowedExtensions -notcontains $_.Extension.ToLower()) {
            Remove-Item $_.FullName -Force
          }
        }

        Copy-Item -Path "Shaders/Decompiler/d3dcompiler_47.dll" -Destination "$tempDir/Luma"

        $rsSrc = 'Source/External/reshade/bin/x64/Release/ReShade64.dll'
        if (Test-Path $rsSrc) {
          Copy-Item -Path $rsSrc -Destination (Join-Path $tempDir 'dxgi.dll') -Force
        }

        if (Test-Path 'Source/External/NGX/bin/rel/nvngx_dlss.dll') {
          Copy-Item -Path 'Source/External/NGX/bin/rel/nvngx_dlss.dll' -Destination $tempDir -Force
        }

        Copy-Item -Path $addonFile -Destination (Join-Path $tempDir "Luma-$projectName.addon")

        Compress-Archive -Path "$tempDir/*" -DestinationPath $zipName -Force
        Remove-Item -Recurse -Force $tempDir

        Write-Host "Packaged $zipName"
        "skip_upload=false" >> $env:GITHUB_OUTPUT

    - name: Upload Unreal Engine package
      if: steps.create_zip.outputs.skip_upload != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Package-${{ matrix.config }}-${{ matrix.platform }}
        path: |
          Luma-Unreal_Engine*.zip

  release:
    runs-on: ubuntu-latest
    needs: build-unreal
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Package-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unreal-raw-${{ github.run_number }}
          name: Unreal Engine Release (Build ${{ github.run_number }})
          body: |
            Single-mod release containing only the Unreal Engine project.

            Installation:
            - Extract the contents directly in the target game's executable folder (replace previous files).
            - Overwrite existing dxgi.dll if you already have a ReShade/other mod that uses it so the Luma files take priority.
            - Launch the game and press Home to bring up ReShade and the Luma menu.
            - Test builds expose additional debugging tools; use the "-Test" archive if you need extra telemetry.

            Last commit: ${{ github.event.head_commit.message }}
          files: |
            Luma-Unreal_Engine*.zip
