name: Build & Package Luma Unreal Engine Mod

on:
  push:
    paths:
      - 'Shaders/Unreal Engine/**'
  workflow_dispatch:

jobs:
  package-unreal:
    name: Package Unreal Engine mod
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare temp package folder
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force temp_package -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path temp_package\Luma | Out-Null

      - name: Copy Shaders into temp
        shell: pwsh
        run: |
          Copy-Item -Path 'Shaders/*' -Destination 'temp_package\Luma' -Recurse -Force

      - name: Prune to Unreal Engine + allowed folders and file types
        shell: pwsh
        run: |
          $shaderRoot = Join-Path 'temp_package' 'Luma'
          $allowedDirs = @('Global','Includes','Unreal Engine')

          Get-ChildItem -Path $shaderRoot -Directory | ForEach-Object {
            if ($allowedDirs -notcontains $_.Name) {
              Remove-Item $_.FullName -Recurse -Force
            }
          }

          # Keep only .hlsl and .hlsli files under allowed folders
          Get-ChildItem -Path $shaderRoot -Recurse -File | ForEach-Object {
            if (@('.hlsl','.hlsli') -notcontains $_.Extension.ToLower()) {
              Remove-Item $_.FullName -Force
            }
          }

      - name: Add d3dcompiler and binaries (dxgi, NGX, addon)
        shell: pwsh
        run: |
          # Copy d3dcompiler into the Luma root
          if (Test-Path 'Shaders/Decompiler/d3dcompiler_47.dll') {
            Copy-Item -Path 'Shaders/Decompiler/d3dcompiler_47.dll' -Destination 'temp_package\Luma' -Force
          } elseif (Test-Path 'Shaders/Decompiler/d3dcompiler_47_x32.dll') {
            Copy-Item -Path 'Shaders/Decompiler/d3dcompiler_47_x32.dll' -Destination 'temp_package\Luma' -Force
          } else {
            Write-Host 'd3dcompiler not found; continuing without it.'
          }

          # Copy ReShade dxgi.dll into temp root if present
          $rsSrc64 = 'Source/External/reshade/bin/x64/Release/ReShade64.dll'
          $rsSrc32 = 'Source/External/reshade/bin/Win32/Release/ReShade32.dll'
          if (Test-Path $rsSrc64) {
            Copy-Item -Path $rsSrc64 -Destination 'temp_package\dxgi.dll' -Force
            Write-Host 'Copied ReShade64 to temp_package\dxgi.dll'
          } elseif (Test-Path $rsSrc32) {
            Copy-Item -Path $rsSrc32 -Destination 'temp_package\dxgi.dll' -Force
            Write-Host 'Copied ReShade32 to temp_package\dxgi.dll'
          } else {
            Write-Host 'ReShade build not found; skipping dxgi copy.'
          }

          # Copy NGX DLSS DLL if available (try release then dev)
          $ngxRel = 'Source/External/NGX/bin/rel/nvngx_dlss.dll'
          $ngxDev = 'Source/External/NGX/bin/dev/nvngx_dlss.dll'
          if (Test-Path $ngxRel) {
            Copy-Item -Path $ngxRel -Destination 'temp_package\nvngx_dlss.dll' -Force
            Write-Host 'Copied NGX release DLL'
          } elseif (Test-Path $ngxDev) {
            Copy-Item -Path $ngxDev -Destination 'temp_package\nvngx_dlss.dll' -Force
            Write-Host 'Copied NGX dev DLL'
          } else {
            Write-Host 'NGX DLSS DLL not found; skipping'
          }

          # Try to locate an addon file for Luma-Unreal Engine in build outputs or repo
          $addon = Get-ChildItem -Path . -Recurse -Filter 'Luma-Unreal*.addon' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($addon) {
            Copy-Item -Path $addon.FullName -Destination 'temp_package\' -Force
            Write-Host "Copied addon $($addon.Name) to temp_package"
          } else {
            Write-Host 'No Luma-Unreal addon found in repo; skipping addon copy.'
          }

      - name: Create full Luma-Unreal_Engine.zip
        shell: pwsh
        run: |
          if (-not (Test-Path 'temp_package')) { Write-Error 'temp_package missing'; exit 1 }
          if (Test-Path 'Luma-Unreal_Engine.zip') { Remove-Item 'Luma-Unreal_Engine.zip' -Force }
          # Package the whole temp_package contents: Luma folder plus dxgi/addon/nvngx if present
          Compress-Archive -Path 'temp_package\*' -DestinationPath 'Luma-Unreal_Engine.zip' -Force
          Write-Host 'Created Luma-Unreal_Engine.zip'

      - name: Create Luma-Unreal_Engine-Test.zip (small-files bundle)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $root = 'temp_package\Luma\Unreal Engine'
          if (-not (Test-Path $root)) { Write-Error "Path not found: $root"; exit 1 }
          $out = 'Luma-Unreal_Engine-Test.zip'
          if (Test-Path $out) { Remove-Item $out -Force }
          $zip = [System.IO.Compression.ZipFile]::Open($out, 'Create')
          try {
            Get-ChildItem -Path $root -Recurse -File | Where-Object { $_.Length -le 200KB } | ForEach-Object {
              $entryName = $_.FullName.Substring($root.Length + 1) -replace '\\','/'
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $_.FullName, $entryName)
            }
          } finally { $zip.Dispose() }
          Write-Host "Created $out"

      - name: List produced files
        shell: pwsh
        run: Get-ChildItem -Path . -Filter 'Luma-Unreal_Engine*.zip' -File | Format-Table Name,Length

      - name: Upload Unreal Engine mod artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Unreal-Engine-artifacts
          path: |
            Luma-Unreal_Engine.zip
            Luma-Unreal_Engine-Test.zip

      - name: Cleanup temp
        shell: pwsh
        run: Remove-Item -Recurse -Force temp_package
